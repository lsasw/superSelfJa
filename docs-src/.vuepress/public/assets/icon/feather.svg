<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- 神经网络节点连线 -->
  <line x1="100" y1="50" x2="60" y2="90" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="140" y2="90" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="60" y1="90" x2="40" y2="135" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="60" y1="90" x2="90" y2="135" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="140" y1="90" x2="110" y2="135" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="140" y1="90" x2="160" y2="135" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="100" y2="90" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.4"/>
  <!-- 第1层节点 (输入层) -->
  <circle cx="100" cy="50" r="12" fill="#7c3aed" opacity="0.9"/>
  <circle cx="100" cy="50" r="5" fill="#ffffff" opacity="0.6"/>
  <!-- 第2层节点 (隐藏层) -->
  <circle cx="60" cy="90" r="10" fill="#6d28d9" opacity="0.85"/>
  <circle cx="140" cy="90" r="10" fill="#6d28d9" opacity="0.85"/>
  <!-- 第3层节点 (隐藏层) -->
  <circle cx="40" cy="135" r="8" fill="#5b21b6" opacity="0.8"/>
  <circle cx="90" cy="135" r="8" fill="#2563eb" opacity="0.8"/>
  <circle cx="110" cy="135" r="8" fill="#2563eb" opacity="0.8"/>
  <circle cx="160" cy="135" r="8" fill="#5b21b6" opacity="0.8"/>
  <!-- AI 标记 -->
  <text x="100" y="180" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#7c3aed" opacity="0.8">AI</text>
</svg>
