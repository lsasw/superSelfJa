<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neuronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="360" height="260" rx="16" fill="url(#aiBg)"/>

  <!-- Neural network nodes -->
  <!-- Input layer (left) -->
  <circle cx="70" cy="90" r="10" fill="#6366f1" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="150" r="10" fill="#8b5cf6" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="210" r="10" fill="#a78bfa" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.85;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Hidden layer (center) - larger glowing nodes -->
  <circle cx="165" cy="75" r="13" fill="url(#neuronGrad)" filter="url(#glow)">
    <animate attributeName="r" values="13;15;13" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="150" r="16" fill="url(#neuronGrad)" filter="url(#glow)">
    <animate attributeName="r" values="16;19;16" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="225" r="13" fill="url(#neuronGrad)" filter="url(#glow)">
    <animate attributeName="r" values="13;15;13" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Output layer (right) -->
  <circle cx="260" cy="110" r="11" fill="#06b6d4" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="190" r="11" fill="#22d3ee" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" valueS="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Connection lines (layer 1 -> hidden) -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.25">
    <line x1="80" y1="90" x2="152" y2="75"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="2s" repeatCount="indefinite"/></line>
    <line x1="80" y1="90" x2="152" y2="150"><animate attributeName="opacity" values="0.2;0.35;0.2" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="80" y1="150" x2="152" y2="75"><animate attributeName="opacity" values="0.2;0.35;0.2" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="80" y1="150" x2="152" y2="150"><animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/></line>
    <line x1="80" y1="150" x2="152" y2="225"><animate attributeName="opacity" values="0.2;0.35;0.2" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="80" y1="210" x2="152" y2="150"><animate attributeName="opacity" values="0.2;0.35;0.2" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="80" y1="210" x2="152" y2="225"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- Connection lines (hidden -> output) -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.25">
    <line x1="178" y1="75" x2="249" y2="110"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="178" y1="150" x2="249" y2="110"><animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/></line>
    <line x1="178" y1="150" x2="249" y2="190"><animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="178" y1="225" x2="249" y2="190"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- AI Brain icon overlay (top right) -->
  <g transform="translate(290, 45)" opacity="0.9">
    <circle cx="32" cy="32" r="30" fill="url(#glowPurple)"/>
    <!-- Brain outline simplified -->
    <path d="M20,28 Q14,28 14,36 Q14,44 22,44 L22,46 Q22,52 28,52 Q34,52 34,46 L34,44 Q42,44 42,36 Q42,28 36,28 Q38,22 33,17 Q28,12 23,17 Q18,22 20,28Z"
          fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
    <!-- Circuit nodes on brain -->
    <circle cx="24" cy="26" r="2.5" fill="#c4b5fd"/>
    <circle cx="34" cy="30" r="2.5" fill="#818cf8"/>
    <circle cx="28" cy="38" r="2.5" fill="#6366f1"/>
    <circle cx="32" cy="46" r="2" fill="#4f46e5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="115" cy="55" r="2" fill="#e0e7ff" opacity="0.4">
    <animate attributeName="cy" values="55;50;55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="260" r="1.5" fill="#a5f3fc" opacity="0.3">
    <animate attributeName="cy" values="260;255;260" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="240" r="2" fill="#ddd6fe" opacity="0.35">
    <animate attributeName="cy" values="245;240;245" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom label bar -->
  <rect x="125" y="235" width="150" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
  <text x="200" y="254" text-anchor="middle" font-family="system-ui" font-size="12" fill="#c4b5fd" font-weight="500">AI Engineering</text>
</svg>