<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="20" y="20" width="360" height="260" rx="16" fill="url(#codeGrad)"/>

  <!-- Code lines decoration -->
  <g opacity="0.15">
    <text x="45" y="60" font-family="monospace" font-size="11" fill="#60a5fa">public class </text>
    <text x="118" y="60" font-family="monospace" font-size="11" fill="#34d399">SuperApp</text>
    <text x="178" y="60" font-family="monospace" font-size="11" fill="#fff">{</text>

    <text x="58" y="80" font-family="monospace" font-size="10" fill="#f472b6">@Autowired</text>
    <text x="58" y="98" font-family="monospace" font-size="10" fill="#60a5fa">private</text>
    <text x="96" y="98" font-family="monospace" font-size="10" fill="#34d399"> SpringService</text>
    <text x="176" y="98" font-family="monospace" font-size="10" fill="#fff"> service;</text>

    <text x="58" y="120" font-family="monospace" font-size="10" fill="#fbbf24">// Enterprise Architecture</text>
    <text x="58" y="138" font-family="monospace" font-size="10" fill="#60a5fa">public</text>
    <text x="94" y="138" font-family="monospace" font-size="10" fill="#34d399"> Response</text>
    <text x="152" y="138" font-family="monospace" font-size="10" fill="#fff"> handle() {</text>

    <text x="72" y="156" font-family="monospace" font-size="10" fill="#60a5fa">return</text>
    <text x="112" y="156" font-family="monospace" font-size="10" fill="#fff"> service.</text>
    <text x="160" y="156" font-family="monospace" font-size="10" fill="#fbbf24">execute</text>
    <text x="204" y="156" font-family="monospace" font-size="10" fill="#fff">();</text>

    <text x="58" y="174" font-family="monospace" font-size="10" fill="#fff">}</text>
    <text x="45" y="192" font-family="monospace" font-size="11" fill="#fff">}</text>
  </g>

  <!-- Java coffee cup icon -->
  <g transform="translate(250, 70)">
    <!-- Cup body -->
    <path d="M10,30 Q8,55 25,65 Q42,55 40,30 Z" fill="url(#javaGrad)" opacity="0.9"/>
    <!-- Cup rim -->
    <ellipse cx="25" cy="30" rx="15" ry="5" fill="#fb923c"/>
    <!-- Steam -->
    <path d="M18,22 Q15,12 22,8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none"/>
    <path d="M26,20 Q28,10 24,5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none"/>
    <path d="M32,22 Q35,14 31,8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.3" fill="none"/>
    <!-- Handle -->
    <path d="M40,36 Q52,36 52,48 Q52,58 40,56" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Gear decorations -->
  <g transform="translate(60, 195)" opacity="0.7">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="18" r="6" fill="#3b82f6" opacity="0.5"/>
  </g>

  <g transform="translate(295, 185)" opacity="0.5">
    <circle cx="14" cy="14" r="12" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" from="360 14 14" to="0 14 14" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="14" r="4" fill="#f97316" opacity="0.5"/>
  </g>

  <!-- Connection lines -->
  <line x1="94" y1="213" x2="180" y2="230" stroke="#3b82f6" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="310" y1="199" x2="240" y2="230" stroke="#f97316" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>

  <!-- Bottom label bar -->
  <rect x="130" y="230" width="140" height="28" rx="14" fill="#3b82f6" opacity="0.15"/>
  <text x="200" y="249" text-anchor="middle" font-family="system-ui" font-size="12" fill="#93c5fd" font-weight="500">Java Backend</text>
</svg>