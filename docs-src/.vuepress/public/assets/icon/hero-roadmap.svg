<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="20" y="20" width="360" height="260" rx="16" fill="url(#roadBg)"/>

  <!-- Staircase path -->
  <path d="M60,230 L60,190 L120,190 L120,145 L185,145 L185,100 L255,100 L255,55 L320,55"
        stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        fill="none" opacity="0.6" stroke-dasharray="8 4"/>

  <!-- Step 1: Foundation -->
  <g transform="translate(45, 205)">
    <rect x="0" y="0" width="50" height="36" rx="8" fill="#10b981" opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="16" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6ee7b7" font-weight="600">基础</text>
    <text x="25" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="#a7f3d0">Foundation</text>
  </g>

  <!-- Step 2: Intermediate -->
  <g transform="translate(105, 160)">
    <rect x="0" y="0" width="54" height="40" rx="8" fill="#059669" opacity="0.25" stroke="#10b981" stroke-width="1.5"/>
    <text x="27" y="16" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a7f3d0" font-weight="600">进阶</text>
    <text x="27" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="#d1fae5">Intermediate</text>
  </g>

  <!-- Step 3: Advanced -->
  <g transform="translate(170, 115)">
    <rect x="0" y="0" width="58" height="44" rx="8" fill="#047857" opacity="0.3" stroke="#059669" stroke-width="1.5"/>
    <text x="29" y="17" text-anchor="middle" font-family="system-ui" font-size="9" fill="#d1fae5" font-weight="600">高级</text>
    <text x="29" y="29" text-anchor="middle" font-family="system-ui" font-size="8" fill="#a7f3d0">Advanced</text>
  </g>

  <!-- Step 4: Expert / Summit -->
  <g transform="translate(240, 68)">
    <rect x="0" y="0" width="62" height="48" rx="10" fill="url(#stepGrad)" opacity="0.3" stroke="#34d399" stroke-width="2"/>
    <!-- Star/crown at top -->
    <polygon points="31,8 33,14 40,14 35,19 37,26 31,21 25,26 27,19 22,14 29,14" fill="#fcd34d" opacity="0.9"/>
    <text x="31" y="36" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ecfdf5" font-weight="700">前沿</text>
  </g>

  <!-- Connecting arrows between steps -->
  <polygon points="98,222 108,218 108,226" fill="#34d399" opacity="0.5"/>
  <polygon points="162,177 172,173 172,181" fill="#10b981" opacity="0.5"/>
  <polygon points="231,132 241,128 241,136" fill="#059669" opacity="0.5"/>

  <!-- Compass rose (bottom left decoration) -->
  <g transform="translate(290, 190)" opacity="0.5">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"/>
    <!-- N arrow -->
    <line x1="28" y1="6" x2="28" y2="50" stroke="#34d399" stroke-width="1" opacity="0.3"/>
    <polygon points="28,4 24,14 32,14" fill="#34d399" opacity="0.6"/>
    <!-- E arrow -->
    <line x1="6" y1="28" x2="50" y2="28" stroke="#34d399" stroke-width="1" opacity="0.2"/>
    <!-- Center dot -->
    <circle cx="28" cy="28" r="3" fill="#6ee7b7" opacity="0.6"/>
  </g>

  <!-- Progress dots along path -->
  <circle cx="90" cy="212" r="3" fill="#6ee7b7" opacity="0.6"/>
  <circle cx="153" cy="167" r="3" fill="#34d399" opacity="0.7"/>
  <circle cx="220" cy="122" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="288" cy="77" r="4" fill="#059669" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating badge -->
  <g transform="translate(280, 215)">
    <rect x="0" y="0" width="76" height="26" rx="13" fill="#059669" opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="38" y="17" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6ee7b7">Roadmap</text>
  </g>
</svg>